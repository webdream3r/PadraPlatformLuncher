  port: 8900
  apiKey: sk-padra-9bdPg4TXX5IsyZbJJfCd8qkLfbDlg4FUNvYl7puIWCg
  mode: concurrent
  defaultModel: lance_3b_video
  preload: false
  idleTimeout: 0
